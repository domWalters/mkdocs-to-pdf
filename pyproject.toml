[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-to-pdf"
version = "0.12.1"
description = "Generate a single PDF file from an `mkdocs` repository"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4 >= 4.9.3",
    "libsass >= 0.23.0",
    "mkdocs >= 1.6.1",
    "pydyf >= 0.12.1",
    "python-barcode >= 0.16.1",
    "qrcode >= 8.2",
    "weasyprint >= 70.0",
]
authors = [
    { name = "orzih" },
]
maintainers = [
    { name = "Dom Walters" },
    { name = "Hideyuki Kato" },
]
keywords = ["mkdocs", "material", "pdf", "weasyprint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.optional-dependencies]
dev = [
    "codespell >= 2.4.3",
    "coverage >= 7.16.2",
    "git-cliff >= 2.13.1",
    "hatch >= 1.18.1",
        "cryptography >= 49.0.0",  # forced to avoid CVE
        "idna >= 3.18",  # forced to avoid CVE
        "jaraco-context >= 6.1.2",  # forced to avoid CVE
    "mypy >= 2.4.0",
    "pre-commit >= 4.6.2",
    "pypdf >= 6.19.0",
    "pytest >= 9.1.1",
    "pytest-cov >= 7.1.0",
    "pytest-order >= 1.5.0",
    "pytest-sugar >= 1.1.1",
    "pytest-xdist >= 3.8.0",
    "ruff < 0.17.0",
    "ty <= 0.0.84",
    "uv < 0.13.0",
]
docs = [
    "mkdocs-material == 9.7.7",
    "mkdocs-minify-plugin == 0.8.0",
        "pymdown-extensions >= 11.0.1",  # forced to avoid CVE
]
samples = [
    "markdown-callouts == 0.4.0",
    "mdx-gh-links == 0.4",
    "mkdocstrings-python == 1.16.5",
    "mkdocs-autorefs == 1.4.0",
    "mkdocs-click == 0.5.0",
    "mkdocs-literate-nav == 0.6.1",
    "mkdocs-material == 9.7.7",
    "mkdocs-minify-plugin == 0.8.0",
    "mkdocs-redirects == 1.2.2",
        "pymdown-extensions >= 11.0.1",  # forced to avoid CVE
]
all = ["mkdocs-to-pdf[dev, docs, samples]"]

[project.entry-points."mkdocs.plugins"]
to-pdf = "mkdocs_to_pdf.plugin:WithPdfPlugin"

[project.urls]
Repository = "https://github.com/domWalters/mkdocs-to-pdf"

[tool.codespell]
# CHANGELOG.md quotes historical commit messages verbatim
exclude-file = "CHANGELOG.md"

[tool.coverage.html]
directory = ".htmlcov"

[tool.coverage.report]
exclude_also = [
    "@overload",
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
branch = true

[tool.coverage.xml]
output = ".coverage.xml"

[tool.hatch.build]
include = [
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "src/mkdocs_to_pdf/**/*.css",
    "src/mkdocs_to_pdf/**/*.html",
    "src/mkdocs_to_pdf/**/*.j2",
    "src/mkdocs_to_pdf/**/*.js",
    "src/mkdocs_to_pdf/**/*.map",
    "src/mkdocs_to_pdf/**/*.scss",
    "src/mkdocs_to_pdf/**/*.py",
    "src/mkdocs_to_pdf/**/py.typed",
]
exclude = [
    "samples",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_to_pdf"]

[tool.hatch.envs.hatch-test]
dependencies = [
    "mkdocs-to-pdf[all]",
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14", "3.15"]

[tool.mypy]
allow_redefinition = true
implicit_reexport = true
mypy_path = "typings"
scripts_are_modules = true
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "pydyf",
    "sass",
    "weasyprint",
    "weasyprint.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--capture=fd -n auto --dist loadgroup --strict-markers -m 'not samples and not slow' --cov=mkdocs_to_pdf --cov-report html --cov-report xml --verbose --junitxml=.junit.xml -o junit_family=legacy"
markers = [
    "samples: builds the bundled sample sites (slow; needs submodules + samples extra)",
    "slow: long-running end-to-end tests",
]
norecursedirs = "samples/*"
testpaths = [
    "tests",
]

[tool.ruff]
unsafe-fixes = true

[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
    "CPY001",   # I don't want copyright notices in every file
    "D203",     # I don't want blank lines before class docstrings
    "D212",     # I want docstring opening lines to be after the """
    "DOC201",   # I don't want to mandate documenting return type with typehints
    "FIX002",   # I want to be able to type TODO
    "N999",     # I want to use the same structure as pyVHDLModel
    "TD002",    # I don't want TODOs to need authors
    "TD003",    # I don't want TODOs to need issue IDs
]
preview = true
select = [
    "ALL",
]
unfixable = [
    "T201", # Don't fix print statements
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "DOC501", # Tests raise deliberately; no Raises section needed
    "D100",   # Tests don't need a module-level docstring
    "INP001", # The tests directory is not a package
    "PLC2701", # Tests intentionally import private helpers
    "PLR2004", # Magic values in assertions are fine
    "S101",   # Assertions are expected in tests
]

[tool.ty.environment]
extra-paths = [
    "typings",
]

[tool.ty.src]
exclude = [
    "samples/**",
]

[tool.ty.rules]
all = "error"
missing-override-decorator = "ignore"  # this is emitted for every dunder override

[tool.uv]
exclude-newer = "7 days"
preview = true
