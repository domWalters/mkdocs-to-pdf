# git-cliff configuration for mkdocs-to-pdf.
#
# Maps the Conventional Commit types enforced by `.commitlintrc.yaml` to
# Keep-a-Changelog sections. `chore`, `ci`, `build`, `test`, and `draft`
# commits are omitted from the changelog.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
    ## [Unreleased]
{%- endif %}

{% for group, commits in commits | group_by(attribute="group") -%}
    ### {{ group }}
    {% for commit in commits -%}
        - {{ commit.message | upper_first | trim }}
    {% endfor %}
{% endfor -%}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

# Commit messages are quoted verbatim and may carry trailing whitespace; strip
# it so the generated file does not fight the `trailing-whitespace` hook.
[[changelog.postprocessors]]
pattern = '[ \t]+\n'
replace = "\n"

[[changelog.postprocessors]]
pattern = '\n+### '
replace = "\n\n### "

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^Merge branch", skip = true },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^docs", group = "Documentation" },
    { message = "^style", group = "Documentation" },
    { message = "^revert", group = "Reverted" },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^build", skip = true },
    { message = "^test", skip = true },
    { message = "^draft", skip = true },
    { message = ".*", group = "Other" },
]
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
