---
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: requirements-dev.txt
    # requirements-dev.txt excludes the project (`uv export --no-emit-project`),
    # so install it explicitly for the `to-pdf` plugin entry point.
    - method: pip
      path: .
