site_name: WeasyPrint Regression Site
site_author: Regression Author
copyright: Copyright Regression

theme:
  name: material

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - to-pdf:
      output_path: pdf/document.pdf
      html_path: single.html
      cover_title: WeasyPrint Regression
      cover_subtitle: Layout correctness corpus
      toc_title: Contents
      toc_level: 3
      ordered_chapter_level: 3
      back_cover: true

nav:
  - Home: index.md
  - Long Code: long-code.md
  - Sections: sections.md
  - Grids and Admonitions: grids.md
  - Images: images.md
